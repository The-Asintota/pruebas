[build-system]
requires = [ "poetry-core>=2.0.0,<3.0.0",]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
development = [ "ruff (>=0.15.0,<0.16.0)", "mypy (>=1.19.1,<2.0.0)", "commitizen (>=4.13.8,<5.0.0)", "pre-commit (>=4.5.1,<5.0.0)",]
testing = [ "pytest (>=9.0.2,<10.0.0)", "pytest-asyncio (>=1.3.0,<2.0.0)", "httpx (>=0.28.1,<0.29.0)",]

[tool.poetry]
name = "api-pricut"
version = "4.1.0"
package-mode = false

[tool.ruff]
line-length = 99
target-version = "py314"
src = [ "src",]
exclude = [ ".venv", "venv", "__pycache__", ".git", ".mypy_cache", ".ruff_cache", "*.egg-info", "dist", "build",]

[tool.commitizen]
name = "cz_customize"

[tool.mypy]
python_version = "3.14"
strict = false
show_error_codes = true
ignore_missing_imports = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true
pretty = true
exclude = [ ".venv", "venv", "__pycache__", ".git", "dist", "build", ".mypy_cache", "alembic/*",]

[tool.poetry.dependencies]
python = "^3.14"
fastapi = "^0.128.6"
gunicorn = "^25.0.3"
pydantic-settings = "^2.12.0"
asyncpg = "^0.31.0"
alembic = "^1.18.3"
orjson = "^3.11.7"
psycopg2-binary = "^2.9.11"
python-dotenv = "^1.2.2"

[tool.ruff.lint]
select = [ "E", "W", "F", "I", "UP", "B", "SIM", "ASYNC",]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.commitizen.customize]
message_template = "{{change_type}}{% if scope %}({{scope}}){% endif %}: {{message}}{% if body %}\n\n{{ body[:1] | upper }}{{ body[1:] }}{% endif %}{% if footer %}\n\n{{footer}}{% endif %}"
schema = "<type>(<scope>): <description>\n\n<body>\n\n<footer>"
schema_pattern = "^(docs|style|refactor|perf|test|build|ci|chore|revert|wip|add)(\\([^\\)]+\\))?:\\s.+?(\\n\\n[\\s\\S]+?)?(\\n\\nBREAKING CHANGE: [\\s\\S]+)?$"
change_type_order = [ "wip", "add", "chore", "docs", "style", "refactor", "perf", "test", "build", "ci", "revert",]
[[tool.commitizen.customize.questions]]
type = "list"
name = "change_type"
message = "Seleccione el tipo de cambio que está implementando."
[[tool.commitizen.customize.questions.choices]]
value = "wip"
name = "wip: Trabajo en progreso, marca un registro temporal de una funcionalidad incompleta."

[[tool.commitizen.customize.questions.choices]]
value = "add"
name = "add: Añadir una nuevo cambio o característica."

[[tool.commitizen.customize.questions.choices]]
value = "chore"
name = "chore: Tareas de mantenimiento que no modifica la lógica de una funcionalidad."

[[tool.commitizen.customize.questions.choices]]
value = "docs"
name = "docs: Cambios en la documentación, guías, README, comentarios de ódigo, etc."

[[tool.commitizen.customize.questions.choices]]
value = "style"
name = "style: Cambios que afectan la apariencia del código (formato) sin cambiar la lógica."

[[tool.commitizen.customize.questions.choices]]
value = "refactor"
name = "refactor: Cambios en el código que no alteran una funcionalidad pero mejora la estructura, legibilidad o mantenibilidad."

[[tool.commitizen.customize.questions.choices]]
value = "perf"
name = "perf: Cambios cuyo objetivo principal es mejorar rendimiento."

[[tool.commitizen.customize.questions.choices]]
value = "test"
name = "test: Añadir, modificar o arreglar pruebas automatizadas."

[[tool.commitizen.customize.questions.choices]]
value = "build"
name = "build: Cambios que afectan el sistema de compilación, empaquetado o dependencias."

[[tool.commitizen.customize.questions.choices]]
value = "ci"
name = "ci: Cambios en la configuración de integración continua (pipelines o workflows)."

[[tool.commitizen.customize.questions.choices]]
value = "revert"
name = "revert: Revertir un commit previo."


[[tool.commitizen.customize.questions]]
type = "input"
name = "scope"
message = "¿Cuál es el \"scope\" de este cambio? (opcional): "
default = ""

[[tool.commitizen.customize.questions]]
type = "input"
name = "message"
message = "------------------------------------------------------\n  RECORDATORIO: ¡Revisa tu ortografía y gramática! \n  Una buena redacción facilita la lectura del historial.\n  ------------------------------------------------------\n\n  Escriba una breve descripción imperativa del cambio: "

[[tool.commitizen.customize.questions]]
type = "input"
name = "body"
message = "Proporcione una descripción más detallada. (opcional): "
default = ""

[[tool.commitizen.customize.questions]]
type = "input"
name = "breaking_description"
message = "Proporcione una descripción para el \"BREAKING CHANGE\". (opcional): "
default = ""

[tool.poetry.dependencies.uvicorn]
extras = [ "standard",]
version = "^0.40.0"

[tool.poetry.dependencies.sqlalchemy]
extras = [ "asyncio",]
version = "^2.0.46"

[tool.poetry.dependencies.passlib]
extras = [ "bcrypt",]
version = "^1.7.4"

[tool.poetry.dependencies.pydantic]
extras = [ "email",]
version = "^2.12.5"

[tool.poetry.dependencies.pyjwt]
extras = [ "crypto",]
version = "^2.12.1"

[tool.ruff.lint.isort]
known-first-party = [ "src",]
